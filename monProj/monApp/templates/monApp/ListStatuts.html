{% extends 'monApp/base.html' %}

{% block menu %}
    <h1>Liste de mes statuts !</h1>
{% endblock %}

{% block contenu %}
    <table class="table">
        <thead>
            <tr>
                <th>Id</th>
                <th>Libellé du statut</th>
            </tr>
        </thead>
        <tbody>
            {% for sta in statuts %}
            <tr>
                <td><a href="{% url 'detailStatut' sta.idStatut %}">{{ sta.idStatut }}</a></td>
                <td>{{ sta.libelleStatut }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
