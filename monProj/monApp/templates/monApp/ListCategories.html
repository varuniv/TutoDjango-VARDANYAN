{% extends 'monApp/base.html' %}

{% block menu %}
    <h1>Liste de mes catégories !</h1>
{% endblock %}

{% block contenu %}
    <table class="table">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nom catégorie</th>
            </tr>
        </thead>
        <tbody>
            {% for cat in categories %}
            <tr>
                <td><a href="{% url 'detailCategorie' cat.idCat %}">{{ cat.idCat }}</a></td>
                <td>{{ cat.nomCat }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
