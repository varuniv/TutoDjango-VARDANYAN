{% extends 'monApp/base.html' %}

{% block menu %}
    <h1>Liste de mes rayons !</h1>
{% endblock %}

{% block contenu %}
    <table class="table">
        <thead>
            <tr>
                <th>Id</th>
                <th>Nom du rayon</th>
            </tr>
        </thead>
        <tbody>
            {% for ray in rayons %}
            <tr>
                <td>{{ ray.idRayon }}</td>
                <td>{{ ray.nomRayon }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
